<text x="1460" y="299" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="end">12 checks</text>
<text x="104" y="388" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="650" text-anchor="start">A11 · FLUXPISTON</text>
<rect x="430.0" y="368" width="755.6" height="34" fill="#61d6a3"/>
<text x="807.7777777777778" y="391" fill="#07111b" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="800" text-anchor="middle">8</text>
